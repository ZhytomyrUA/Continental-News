name: Continental News Bot v8.4.1 — Visual & Editorial + Decoder Fix

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: daily
        options:
          - daily
          - archive

concurrency:
  group: continental-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install bot dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python - <<'PY'
          import googlenewsdecoder
          print("googlenewsdecoder import: OK")
          print("module:", googlenewsdecoder.__file__)
          PY

      - name: Validate bot.py
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bot.py
          echo "bot.py compile check: OK"

      - name: Run Continental News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          BOOTSTRAP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'archive' && '1' || '0' }}
          TZ: Europe/Berlin
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "ERROR: TELEGRAM_BOT_TOKEN missing."; exit 1; }
          test -n "${TELEGRAM_CHANNEL_ID:-}" || { echo "ERROR: TELEGRAM_CHANNEL_ID missing."; exit 1; }
          echo "Workflow event: ${GITHUB_EVENT_NAME}"
          echo "FORCE_RUN: ${FORCE_RUN}"
          echo "BOOTSTRAP_MODE: ${BOOTSTRAP_MODE}"
          python bot.py

      - name: Persist bot state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continental_pending.json continental_published.json continental_messages.json continental_jobs_seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: persist Continental news bot state"
          git push origin HEAD:${GITHUB_REF_NAME}
