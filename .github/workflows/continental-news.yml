name: Continental News Bot v8.4.3

on:
  # GitHub Actions uses UTC. We trigger at both possible UTC hours for CET/CEST.
  # bot.py is the final gate, so only 09:00 and 18:00 Europe/Berlin perform a search/publication.
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  continental-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continental News Bot v8.4.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: "-1004303733076"
          TZ: "Europe/Berlin"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python bot.py

      - name: Save bot history
        run: |
          git config user.name "continental-news-bot"
          git config user.email "continental-news-bot@users.noreply.github.com"
          for f in continental_published.json continental_pending.json continental_messages.json continental_jobs_seen.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update Continental news history"
            git push
          fi
