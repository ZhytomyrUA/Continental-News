name: Continental News

on:
  schedule:
    # The bot itself checks Europe/Berlin == 09:00.
    # Running at both UTC hours covers CET/CEST without publishing twice.
    - cron: "0 7,8 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Publish now (ignore 09:00 Europe/Berlin gate)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run && '1' || '0' }}
      BOOTSTRAP_MODE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v6.0.txt

      - name: Dependency check
        run: |
          python - <<'PY'
          import googlenewsdecoder
          from selectolax.parser import HTMLParser
          print("googlenewsdecoder: import OK")
          print("selectolax: import OK")
          PY

      - name: Run Continental News Bot
        run: python bot.py

      - name: Commit archive and queue
        run: |
          git config user.name "continental-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py continental_published.json continental_pending.json continental_messages.json
          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
          else
            git commit -m "chore: update Continental News archive"
            git push
          fi
