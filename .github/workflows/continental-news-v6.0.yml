name: Continental News Bot v6.0

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 07:00 UTC = 09:00 Europe/Berlin during summer time.
    # 08:00 UTC = 09:00 Europe/Berlin during winter time.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: continental-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements_v6.0.txt

      - name: Install bot dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements_v6.0.txt

      - name: Validate bot.py
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile bot.py
          echo "bot.py compile check: OK"

      - name: Run Continental News Bot v6.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TZ: Europe/Berlin
        shell: bash
        run: |
          set -euo pipefail

          test -n "${TELEGRAM_BOT_TOKEN:-}" || {
            echo "ERROR: TELEGRAM_BOT_TOKEN missing."
            exit 1
          }

          test -n "${TELEGRAM_CHANNEL_ID:-}" || {
            echo "ERROR: TELEGRAM_CHANNEL_ID missing."
            exit 1
          }

          echo "Workflow event: ${GITHUB_EVENT_NAME}"
          echo "FORCE_RUN: ${FORCE_RUN}"

          python bot.py

      - name: Persist bot state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            continental_pending.json \
            continental_published.json \
            continental_messages.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: persist Continental news bot state"
          git push origin HEAD:${GITHUB_REF_NAME}
